# Headers sent with every response. nginx drops server-level add_header
# directives in a location that has its own, so each location includes this.

# Cross-origin isolation, needed for multithreaded WebAssembly.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# - script-src: Pyodide and the FFmpeg core for URL downloads load from
#   jsDelivr; 'wasm-unsafe-eval' allows compiling WebAssembly.
# - connect-src https:: URL download fetches the page the user entered, PyPI
#   and jsDelivr.
# - style-src 'unsafe-inline': the page sets inline style attributes (progress
#   bar width, waveform playheads).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https: blob: data:; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
